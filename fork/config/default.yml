    title: 'Welcome to Toxic Bar'
    message: "<p class='xpup-welcome-logo'><a href='https://www.digitalnisebeobrana.cz' target='_blank' rel='noopener noreferrer'><img src='assets/public/images/digitalni-sebeobrana-logo.png' alt='Digitální sebeobrana'/></a></p><p><strong>Toxic Bar</strong> — Questionable drinks for questionable times.</p><p>Hydration for the end of the network. Salvaged ingredients, unstable recipes, black-market classics and a few things nobody has officially declared safe.</p><p>This is your private training e-shop (L1–L9) by <a href='https://www.digitalnisebeobrana.cz' target='_blank' rel='noopener noreferrer'><strong>Digitální sebeobrana</strong></a>. It intentionally contains vulnerabilities for practice only. Stay inside this instance — do not target other systems or the open Internet.</p><p>Sign in with the lab accounts from your instance materials (for example <code>a@lab.test</code>).</p><p class='xpup-upstream-note'>Based on a customized fork of <a href='https://owasp-juice.shop' target='_blank' rel='noopener noreferrer'><strong>OWASP Juice Shop</strong></a> (MIT), an open-source project of the <a href='https://owasp.org' target='_blank' rel='noopener noreferrer'>Open Worldwide Application Security Project</a>.</p>"
