<div class="center-container">
  <mat-card appearance="outlined" class="mat-elevation-z6">
    <div class="mdc-card">
      <h1>Nové heslo</h1>
      <div class="confirmation" [hidden]="!confirmation">{{ confirmation }}</div>
      <div class="error" [hidden]="!error">{{ error }}</div>
      <div class="form-container">
        <mat-form-field appearance="outline" color="tertiary">
          <mat-label translate>LABEL_NEW_PASSWORD</mat-label>
          <input id="newPassword" [formControl]="passwordControl" type="password" matInput>
          <mat-hint>15–128 znaků</mat-hint>
        </mat-form-field>
        <mat-form-field appearance="outline" color="tertiary">
          <mat-label translate>LABEL_REPEAT_NEW_PASSWORD</mat-label>
          <input id="newPasswordRepeat" [formControl]="repeatPasswordControl" type="password" matInput>
          @if (repeatPasswordControl.invalid && repeatPasswordControl.errors.notSame) {
            <mat-error translate>PASSWORDS_DO_NOT_MATCH</mat-error>
          }
        </mat-form-field>
        <button id="resetPassword" type="submit" mat-raised-button color="primary"
          [disabled]="passwordControl.invalid || repeatPasswordControl.invalid || !token" (click)="resetPassword()">
          <span>Nastavit heslo</span>
        </button>
      </div>
    </div>
  </mat-card>
</div>
