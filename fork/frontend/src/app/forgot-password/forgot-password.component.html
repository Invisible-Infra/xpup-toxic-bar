<div class="center-container">
  <mat-card appearance="outlined" class="mat-elevation-z6">
    <div class="mdc-card">
      <h1 translate>TITLE_FORGOT_PASSWORD</h1>
      <div class="confirmation" [hidden]="!confirmation">{{ confirmation }}</div>
      <div class="error" [hidden]="!error">{{ error }}</div>
      <div class="form-container">
        <mat-form-field appearance="outline" color="tertiary">
          <mat-label translate>LABEL_EMAIL</mat-label>
          <input id="email" [formControl]="emailControl" type="email" matInput aria-label="Email address field">
          @if (emailControl.invalid && emailControl.errors.required) {
            <mat-error translate>MANDATORY_EMAIL</mat-error>
          }
          @if (emailControl.invalid && emailControl.errors.email) {
            <mat-error translate>INVALID_EMAIL</mat-error>
          }
        </mat-form-field>
        <button id="requestReset" type="submit" mat-raised-button color="primary"
          [disabled]="emailControl.invalid" (click)="requestLink()">
          <span>Odeslat odkaz</span>
        </button>
      </div>
    </div>
  </mat-card>
</div>
