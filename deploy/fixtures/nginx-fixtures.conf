# Two Hostnames, one container — preserves L8 SSRF distinction by hostname.
server {
  listen 80;
  server_name fixture-public;
  root /usr/share/nginx/html/public;
  index index.html;

  location = /hop {
    return 302 http://fixture-canary/;
  }
  location = /hop2 {
    return 302 http://fixture-canary/;
  }
  location = /two {
    return 302 http://fixture-public/hop2;
  }
  location = /hop-out {
    return 302 http://203.0.113.10/;
  }
  location = /slow {
    proxy_pass http://fixture-delay:8081/;
    proxy_read_timeout 10s;
    proxy_connect_timeout 10s;
  }
}

server {
  listen 80;
  server_name fixture-canary;
  root /usr/share/nginx/html/canary;
  index index.html;
}

# Default: empty (no accidental canary on unknown Host).
server {
  listen 80 default_server;
  server_name _;
  return 404;
}
